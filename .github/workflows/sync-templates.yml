name: Sync templates

on:
  repository_dispatch:
    types: [templates-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify templates fetch
        run: |
          curl -fsSL https://raw.githubusercontent.com/Create-Node-App/cna-templates/main/templates.json | head -c 200
          echo "templates.json reachable"
